<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Viewer</title>
    <!-- Discord SDK muss bleiben -->
    <script src="https://discord.com/activities/app-sdk.js"></script> 
    <style>
        /* CSS für Vollbild */
        body {
            margin: 0;
            padding: 0;
            height: 100vh; /* Volle Höhe des Browserfensters */
            width: 100vw;  /* Volle Breite des Browserfensters */
            display: flex;
            flex-direction: column;
        }
        #webFrame {
            width: 100%;
            height: 100%; /* Der Iframe nimmt den gesamten verfügbaren Platz ein */
            border: none;
            background: white;
        }
        /* Nur Status-Anzeige behalten */
        #status {
            position: absolute;
            top: 10px; /* Verschieben nach oben, damit er nicht über dem Iframe ist */
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 100;
        }
        .connected { color: #4ecca3; }
        .disconnected { color: #e94560; }
    </style>
</head>
<body>
    <!-- Nur der Iframe und die Statusanzeige bleiben -->
    <iframe id="webFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
    <div id="status" class="disconnected">Verbindung wird hergestellt...</div>

    <script>
        let discordSdk;
        const statusEl = document.getElementById('status');
        const frameEl = document.getElementById('webFrame');
        
        // 🚀 WICHTIGE ÄNDERUNG: Dein Live-Proxy auf Railway!
        const PROXY_BASE = 'https://discord-webviewer-production.up.railway.app/proxy?url=';

        async function setupDiscord() {
            try {
                discordSdk = new Discord.SDK({
                    clientId: '1534502023997685770', 
                });
                
                await discordSdk.ready();
                
                const channel = await discordSdk.commands.getChannel();
                statusEl.textContent = `Verbunden: ${channel.name}`;
                statusEl.className = 'connected';
                
                // Auf Broadcasts hören
                discordSdk.subscribe('BROADCAST', (data) => {
                    if (data.type === 'URL_CHANGE') {
                        loadUrl(data.url, false); 
                    }
                });
            } catch (err) {
                console.error('Discord SDK Fehler:', err);
                statusEl.textContent = 'Lokaler Modus (Test)';
                statusEl.style.color = '#ffa500';
            }
        }
        
        function loadUrl(url, broadcast = true) {
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            // URL über den Proxy leiten!
            const proxyUrl = PROXY_BASE + encodeURIComponent(url);

            frameEl.src = proxyUrl; // <-- Hier wird der Proxy-Link gesetzt!
            
            // An andere senden (Nur wenn wir nicht gerade ein internes Update durchführen)
            if (broadcast && discordSdk) {
                discordSdk.commands.broadcast({
                    type: 'URL_CHANGE',
                    url: url
                }).catch(() => {});
            }
        }

        // Initialisierung und Start mit einer Standardseite
        setupDiscord();
        loadUrl('https://example.com'); // Lädt direkt beim Start eine Testseite
    </script>
</body>
</html>
