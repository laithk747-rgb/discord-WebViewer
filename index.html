<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Viewer Activity</title>
    <script src="https://discord.com/activities/app-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #header {
            background: #16213e;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #0f3460;
        }
        
        #urlInput {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: white;
            font-size: 14px;
        }
        
        #loadBtn {
            padding: 10px 20px;
            background: #e94560;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        #loadBtn:hover {
            background: #ff6b6b;
        }
        
        #frameContainer {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        #webFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .connected { color: #4ecca3; }
        .disconnected { color: #e94560; }
    </style>
</head>
<body>
    <div id="header">
        <span>🌐</span>
        <input type="text" id="urlInput" placeholder="https://example.com" value="https://example.com">
        <button id="loadBtn">Laden</button>
    </div>
    
    <div id="frameContainer">
        <iframe id="webFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        <div id="status" class="disconnected">Nicht verbunden</div>
    </div>

    <script>
        // Discord SDK initialisieren
        let discordSdk;
        
        async function setupDiscord() {
            try {
                discordSdk = new Discord.SDK({
                    clientId: '1534502023997685770', // Wird später ersetzt
                });
                
                await discordSdk.ready();
                
                // Mit dem Voice Channel verbinden
                const channel = await discordSdk.commands.getChannel();
                
                // Status anzeigen
                document.getElementById('status').textContent = `Verbunden: ${channel.name}`;
                document.getElementById('status').className = 'connected';
                
                // Auf Nachrichten von anderen Teilnehmern hören
                discordSdk.subscribe('MESSAGE_CREATE', (data) => {
                    if (data.message && data.message.content) {
                        loadUrl(data.message.content);
                    }
                });
                
            } catch (err) {
                console.error('Discord SDK Fehler:', err);
                // Lokalen Modus für Tests außerhalb Discord
                document.getElementById('status').textContent = 'Lokaler Modus';
            }
        }
        
        function loadUrl(url) {
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            document.getElementById('webFrame').src = url;
            document.getElementById('urlInput').value = url;
        }
        
        // Event Listener
        document.getElementById('loadBtn').addEventListener('click', () => {
            const url = document.getElementById('urlInput').value;
            loadUrl(url);
            
            // URL an andere Teilnehmer senden (wenn verbunden)
            if (discordSdk) {
                discordSdk.commands.broadcast({
                    type: 'URL_CHANGE',
                    url: url
                });
            }
        });
        
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loadBtn').click();
            }
        });
        
        // Initialisieren
        setupDiscord();
        loadUrl('https://example.com');
    </script>
</body>
</html>
